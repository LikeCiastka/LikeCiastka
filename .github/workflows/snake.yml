name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: 🐍 Generate Snake
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: LikeCiastka
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9B7EBD&color_dots=#EDE7F6,#D8C4E8,#C8A2C8,#B497BD,#9B7EBD
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E8C7E8

      - name: 🚀 Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
